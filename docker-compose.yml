services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    environment:
      - STATIC_DIR=/app/dist
      - GO_PORT=8080
      # War Room dataset store. Falls back to in-memory if unreachable/unset.
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # The portal's Redis: the War Room dataset, the report cache (Sports and
    # VOD), and the usage counts the top-clients auto-cache ranks by. Traffic and
    # Torrent Analysis are cached by reports_api in ITS own Redis (reports_redis),
    # on the reports_api server — the portal reads them through its endpoints.
    #
    # Capped with LRU eviction, and PERSISTED: append-only file, flushed every
    # second, on a named volume. Without it every rebuild of this stack (which
    # recreates this container) emptied all of the above at once — including a
    # torrent search that takes minutes to rebuild and the usage history, which
    # cannot be rebuilt at all. 512 MB matches what the Cache & Redis tab sets;
    # the tab can still change it at run time.
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru",
              "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  # Redis's append-only file — see the redis service above.
  redis-data:

networks:
  # Named explicitly so reports_api (its own compose project) can join it and
  # reach this Redis as redis:6379 — whatever folder this project is deployed from.
  default:
    name: iphouse_latest_default
